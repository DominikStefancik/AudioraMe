[package]
name = "audiora-me-server"
version = "0.1.0"
edition = "2024"
authors = ["Dominik Stefancik <dstefancik@gmail.com>"]

[dependencies]
# Core web framework
axum = { version = "0.8.8", features = ["macros"] }
tokio = { version = "1.50.0", features = ["full"] }

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

# Logging
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
