[package]
name = "audiora-me-server"
version = "0.1.0"
edition = "2024"
authors = ["Dominik Stefancik <dstefancik@gmail.com>"]

[dependencies]
# Core web framework
axum = { version = "0.8.9", features = ["http2", "macros", "multipart", "ws"] }
tokio = { version = "1.54.1", features = ["full"] }

# Rust doesn’t natively support async methods in traits yet.
# The crate handles all the complex transformations behind the scenes.
async-trait = "0.1.92"

# Database
sqlx = { version = "0.9.0", features = [
    "chrono",
    "migrate",
    "postgres",
    "runtime-async-std",
    "uuid",
] }

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Validation
validator = { version = "0.21.0", features = ["derive"] }

# UUID and time
uuid = { version = "1.29.2", features = ["serde", "v4"] }
chrono = { version = "0.4.45", features = ["serde"] }

# Logging
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

# Configuration
dotenvy = "0.15.7"
